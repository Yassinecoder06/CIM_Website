<!doctype html>
<html lang="en" class="is-loading">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#111A24" />
    <meta name="description" content="Club INSAT Maintenance — engineering into action." />
    <title>CIM — Club INSAT Maintenance</title>
    <style>
      html.is-loading, html.is-loading body { overflow: hidden; }
      #app-loader-static {
        position: fixed; inset: 0; z-index: 9999;
        display: grid; place-items: center;
        background: radial-gradient(circle at 50% 50%, rgb(13 60 82 / 28%), transparent 36%), linear-gradient(135deg, #0B1E2A 0%, #143A4A 52%, #0A1E2B 100%);
        color: white; font-family: Inter, system-ui, sans-serif;
        transition: opacity 520ms cubic-bezier(0.16, 1, 0.3, 1), visibility 520ms;
      }
      #app-loader-static.app-loader-static--out { opacity: 0; visibility: hidden; pointer-events: none; }
      #app-loader-static .app-loader-static__card {
        width: min(26rem, calc(100% - 2rem)); text-align: center;
        padding: 1.5rem; position: relative;
      }
      #app-loader-static .app-loader-static__word {
        position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        font-family: "Space Grotesk", sans-serif; font-size: clamp(10rem, 30vw, 22rem); font-weight: 700; letter-spacing: -0.13em;
        color: rgb(217 221 38 / 10%); line-height: 1; pointer-events: none; user-select: none;
      }
      #app-loader-static .app-loader-static__eyebrow { color: #D9DD26; font-size: .62rem; font-weight: 800; letter-spacing: .14em; }
      #app-loader-static h1 { margin: .7rem 0; font-family: "Space Grotesk", sans-serif; font-size: clamp(1.8rem, 4vw, 2.6rem); line-height: .9; letter-spacing: -0.06em; }
      #app-loader-static h1 em { color: #111A24; font-style: normal; }
      #app-loader-static p { color: rgb(255 255 255 / 68%); font-size: .82rem; min-height: 1.2rem; }
      #app-loader-static .app-loader-static__bar { height: .32rem; margin-top: 1.2rem; border: 1px solid rgb(217 221 38 / 42%); background: rgb(255 255 255 / 9%); overflow: hidden; }
      #app-loader-static .app-loader-static__bar i { display: block; height: 100%; width: 18%; background: #D9DD26; box-shadow: 0 0 1rem rgb(217 221 38 / 80%); animation: app-loader-static-pulse 1.1s ease-in-out infinite; }
      @keyframes app-loader-static-pulse { 0% { transform: translateX(-100%); } 50% { transform: translateX(200%); } 100% { transform: translateX(400%); } }
    </style>
  </head>
  <body>
    <div id="app-loader-static" role="status" aria-live="polite" aria-label="Loading CIM">
      <div class="app-loader-static__card">
        <div class="app-loader-static__word" aria-hidden="true">CIM</div>
        <div class="app-loader-static__eyebrow">CIM // SYSTEM BOOT</div>
        <h1>Engineering<br><em>into</em> action.</h1>
        <p>Preparing visual system…</p>
        <div class="app-loader-static__bar" aria-hidden="true"><i></i></div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <noscript><style>#app-loader-static{display:none}</style></noscript>
  </body>
</html>
