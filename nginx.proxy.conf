# External Nginx reverse proxy for CIM VPS
# Proxies to cim-website (internal nginx serving dist)
# Use this when you want TLS termination or multiple sites on one VPS

server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Proxy to the app container (internal nginx handles SPA fallback, gzip, cache)
    location / {
        proxy_pass http://cim-website:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Uncomment for HTTPS (requires cert volume)
    # listen 443 ssl http2;
    # ssl_certificate /etc/nginx/certs/fullchain.pem;
    # ssl_certificate_key /etc/nginx/certs/privkey.pem;
    # if ($scheme != "https") { return 301 https://$host$request_uri; }
}
