server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip for text assets (not GLB - already compressed)
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;
    gzip_min_length 256;

    # Cache static assets aggressively; GLB and images are hashed by Vite
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # GLB - large, already draco+etc1s compressed, no gzip, long cache
    location ~* \.glb$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Type "model/gltf-binary";
        try_files $uri =404;
    }

    # Memories images - cache
    location /assets/memories/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # SPA fallback - must be last
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
